name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check public candidate safety
        env:
          PUBLIC_SAFETY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:public-safety

      - name: Validate fictional examples
        run: npm run validate:examples

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run clean-browser end-to-end proof
        run: npm run test:e2e

      - name: Upload end-to-end failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # This is intentionally strict: the current lockfile has no high or critical findings.
      - name: Audit high and critical npm vulnerabilities
        run: npm audit --audit-level=high
